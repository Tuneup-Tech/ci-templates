name: Verify stayed up
description: >-
  After a deploy, snapshot the compose service containers, wait, snapshot
  again. Fail if any container is not running, restarted, or went unhealthy
  (prints its last 40 log lines). Shared by app and infra deploy templates.
inputs:
  host:
    required: true
  username:
    required: true
  key:
    required: true
  port:
    required: false
    default: "22"
  server_path:
    description: dir on the server holding the compose file
    required: true
  services:
    description: space-separated compose services. empty = every service in the project.
    required: false
    default: ""
  seconds:
    description: how long to watch
    required: false
    default: "60"
  allow_clean_exit:
    description: >-
      true = a container that exited 0 AND has restart policy "no" is
      fine (one-shot jobs in infra stacks). Long-running containers that
      exit 0 still fail. false = any non-running container fails (apps).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # no arithmetic in ${{ }} expressions, so compute here
    - id: t
      shell: bash
      env:
        SECONDS_IN: ${{ inputs.seconds }}
      run: echo "timeout=$((SECONDS_IN + 300))s" >> "$GITHUB_OUTPUT"
    # compose up returns once container STARTED, not stayed up. 2026-10-27
    # true-cost crash-looped 7.5h on missing env var, run said success.
    - uses: appleboy/ssh-action@v1
      env:
        SERVICES: ${{ inputs.services }}
        WAIT_S: ${{ inputs.seconds }}
        ALLOW_CLEAN_EXIT: ${{ inputs.allow_clean_exit }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        port: ${{ inputs.port }}
        envs: SERVICES,WAIT_S,ALLOW_CLEAN_EXIT
        # watch window + 5m slack, so a long seconds no get killed mid-sleep
        command_timeout: ${{ steps.t.outputs.timeout }}
        script: |
          set -eu
          cd ${{ inputs.server_path }}

          snapshot() {
            # SERVICES unquoted on purpose: word-split into one arg per service
            for ID in $(docker compose ps -aq ${SERVICES:-}); do
              # container gone between ps and inspect = report it, not die silently under set -e
              docker inspect --format='{{.Name}} {{.State.Status}} {{.RestartCount}} {{.State.StartedAt}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} {{.State.ExitCode}} {{with .HostConfig.RestartPolicy.Name}}{{.}}{{else}}no{{end}}' "$ID" 2>/dev/null \
                || echo "$ID vanished 0 - none 1 always"
            done
          }
          BEFORE=$(snapshot)
          if [ -z "$BEFORE" ]; then
            echo "::error::no container exists for ${SERVICES:-the project} after deploy"; exit 1
          fi
          echo "watching ${SERVICES:-all services} for ${WAIT_S}s"
          sleep "$WAIT_S"
          AFTER=$(snapshot)
          echo "$AFTER"

          BAD=""
          while read -r NAME STATUS RESTARTS STARTED HEALTH EXITCODE POLICY; do
            [ -n "$NAME" ] || continue
            WAS=$(echo "$BEFORE" | awk -v n="$NAME" '$1==n {print $3}')
            # StartedAt too: autoheal `docker restart` no bump RestartCount
            WAS_STARTED=$(echo "$BEFORE" | awk -v n="$NAME" '$1==n {print $4}')
            if [ "$STATUS" = "exited" ] && [ "$EXITCODE" = "0" ] && [ "$POLICY" = "no" ] && [ "$ALLOW_CLEAN_EXIT" = "true" ]; then :
            elif [ "$STATUS" != "running" ]; then BAD="$BAD $NAME:$STATUS"
            elif [ -n "$WAS" ] && [ "$RESTARTS" != "$WAS" ]; then BAD="$BAD $NAME:restarted($WAS->$RESTARTS)"
            elif [ -n "$WAS_STARTED" ] && [ "$STARTED" != "$WAS_STARTED" ]; then BAD="$BAD $NAME:restarted"
            elif [ "$HEALTH" = "unhealthy" ]; then BAD="$BAD $NAME:unhealthy"
            fi
          done <<EOF
          $AFTER
          EOF

          if [ -n "$BAD" ]; then
            echo "::error::${SERVICES:-stack} did not stay up:$BAD"
            for ID in $(docker compose ps -aq ${SERVICES:-}); do
              echo "---- last log lines: $(docker inspect --format='{{.Name}}' "$ID")"
              docker logs --tail 40 "$ID" 2>&1 || true
            done
            exit 1
          fi
          echo "${SERVICES:-stack} stayed up for ${WAIT_S}s"
