name: Reusable — Infra Compose Deploy

on:
  workflow_call:
    inputs:
      server_path:
        description: "Absolute path on the server where the compose file lives"
        required: true
        type: string
      compose_file:
        description: "Path to the docker-compose file to copy (relative to repo root)"
        required: false
        type: string
        default: "docker-compose.yml"
      extra_files:
        description: "Comma-separated list of additional files to copy (e.g. traefik.yml,config.yml)"
        required: false
        type: string
        default: ""
      services:
        description: "Space-separated list of services to restart (leave empty to restart all)"
        required: false
        type: string
        default: ""
      ssh_port:
        description: "SSH port on the remote server"
        required: false
        type: number
        default: 22
      has_env:
        description: "Set to true if APP_ENV secret should be written as .env on the server"
        required: false
        type: boolean
        default: false
      env_sample:
        description: "Optional repo path (e.g. .env-sample) listing required APP_ENV keys. Checked on the runner BEFORE anything touches the server; a missing, blank or <placeholder> key stops the deploy. Lines ending '# optional' are not required."
        required: false
        type: string
        default: ""
      pre_deploy_script:
        description: "Optional shell commands to run on the server before docker compose pull & up"
        required: false
        type: string
        default: ""
      post_deploy_script:
        description: "Optional shell commands to run on the server after docker compose pull & up"
        required: false
        type: string
        default: ""
      registry:
        description: "Container registry to log into on the server. Defaults to ghcr.io; login auto-skips if no token is provided."
        required: false
        type: string
        default: "ghcr.io"
    secrets:
      SSH_HOST:
        required: true
      SSH_USERNAME:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      APP_ENV:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false

jobs:
  deploy:
    name: Deploy Infra to Server
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # runs on the runner, before any scp/ssh step: a bad APP_ENV stops the
      # deploy with the server untouched (no files copied, .env not rewritten).
      # 2026-10-07 monitoring: token-only APP_ENV dropped AUTHENTIK_* -> grafana
      # login loop, only noticed when sessions expired.
      - name: Validate APP_ENV against env sample
        if: ${{ inputs.has_env && inputs.env_sample != '' }}
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          ENV_SAMPLE: ${{ inputs.env_sample }}
        run: |
          set -eu
          if [ ! -f "$ENV_SAMPLE" ]; then
            echo "::error::env_sample '$ENV_SAMPLE' not found in repo"; exit 1
          fi
          if [ -z "$APP_ENV" ]; then
            echo "::error::APP_ENV secret is empty"; exit 1
          fi
          umask 077
          decoded="$RUNNER_TEMP/app.env"
          trap 'rm -f "$decoded"' EXIT
          if ! printf '%s' "$APP_ENV" | base64 -d > "$decoded" 2>/dev/null; then
            echo "::error::APP_ENV is not valid base64"; exit 1
          fi
          keys=$(tr -d '\r' < "$ENV_SAMPLE" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' \
            | grep -v -E '#[[:space:]]*optional[[:space:]]*$' | cut -d= -f1 || true)
          if [ -z "$keys" ]; then
            echo "::error::no required keys in $ENV_SAMPLE"; exit 1
          fi
          missing=""
          for key in $keys; do
            value=$(tr -d '\r' < "$decoded" | grep -E "^${key}=" | tail -n 1 | cut -d= -f2- \
              | sed -e 's/^["'\'']//' -e 's/["'\'']$//' || true)
            trimmed=$(printf '%s' "$value" | tr -d '[:space:]')
            case "$trimmed" in
              ''|'<'*'>') missing="$missing $key" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::APP_ENV missing, blank or placeholder:$missing -- deploy stopped, server untouched"
            exit 1
          fi
          echo "APP_ENV has every required key in $ENV_SAMPLE"

      - name: Ensure server directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          script: |
            sudo mkdir -p ${{ inputs.server_path }}
            sudo chown -R ${{ secrets.SSH_USERNAME }}:${{ secrets.SSH_USERNAME }} ${{ inputs.server_path }}

      - name: Copy compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          source: ${{ inputs.compose_file }}
          target: ${{ inputs.server_path }}
          overwrite: true

      - name: Copy extra config files
        if: ${{ inputs.extra_files != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          source: ${{ inputs.extra_files }}
          target: ${{ inputs.server_path }}
          overwrite: true

      - name: Write .env file
        if: ${{ inputs.has_env }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          script: |
            echo "${{ secrets.APP_ENV }}" | base64 -d > ${{ inputs.server_path }}/.env

      - name: Run pre-deploy script
        if: ${{ inputs.pre_deploy_script != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          script: ${{ inputs.pre_deploy_script }}

      - name: Registry login on server
        if: ${{ inputs.registry != '' }}
        uses: appleboy/ssh-action@v1
        env:
          # Fall back to the run's built-in GITHUB_TOKEN when no PAT is supplied.
          REG_USER: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN || github.token }}
          REGISTRY: ${{ inputs.registry }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          envs: REG_USER,REG_TOKEN,REGISTRY
          script: |
            set -euo pipefail
            if [ -z "${REG_TOKEN:-}" ] || [ -z "${REG_USER:-}" ]; then
              echo "No registry credentials provided — skipping login (anonymous pull)."
              exit 0
            fi
            echo "$REG_TOKEN" | docker login "$REGISTRY" -u "$REG_USER" --password-stdin

      - name: Pull & restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          script: |
            set -euo pipefail
            cd ${{ inputs.server_path }}
            docker compose pull ${{ inputs.services }}
            docker compose up -d --remove-orphans ${{ inputs.services }}
            docker image prune -f

      - name: Run post-deploy script
        if: ${{ inputs.post_deploy_script != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ inputs.ssh_port }}
          script: ${{ inputs.post_deploy_script }}
